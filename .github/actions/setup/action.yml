name: Setup
description: Setup Node.js, pnpm, and install dependencies with optional Turbo caching

inputs:
  turbo-cache-suffix:
    description: Suffix for the Turbo cache key (enables Turbo caching when set)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Restore Turbo cache
      if: inputs.turbo-cache-suffix != ''
      uses: actions/cache@v6
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ inputs.turbo-cache-suffix }}-${{ github.ref_name }}-${{ github.sha }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'packages/**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ inputs.turbo-cache-suffix }}-${{ github.ref_name }}-
          ${{ runner.os }}-turbo-${{ inputs.turbo-cache-suffix }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
