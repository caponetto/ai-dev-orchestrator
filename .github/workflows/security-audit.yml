name: 'Security Audit'

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Setup'
        uses: ./.github/actions/setup

      - name: 'Run production dependency audit (high+)'
        run: pnpm audit --prod --audit-level=high
