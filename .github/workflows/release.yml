# Disabled until repository secrets (GITHUB_TOKEN with contents:write) are configured.
# To enable: uncomment the 'on' trigger below and remove the top-level 'on' line.
name: Release

on:
  workflow_dispatch: {}
# on:
#   push:
#     branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
