id: ux_reviewer
name: UX Reviewer
description: Review implementation for usability, accessibility, and user experience quality
owned_artifacts:
  - ux_review
readable_artifacts:
  - implementation
  - canonical_specification
  - codebase_context
  - test_suite
  - pr_diff_context
forbidden_artifacts:
  - plan
reviewed_by: []
reviews:
  - implementer
agreement_participation:
  - agreement_type: implementation_agreement
    action: reviewed
required_capabilities:
  - code_review
  - reasoning
  - structured_output
model: gpt-5.4-medium
max_tokens: null
dispatch_type: agent
runner: cursor
