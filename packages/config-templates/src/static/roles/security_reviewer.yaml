id: security_reviewer
name: Security Reviewer
description: Review implementation for security vulnerabilities
owned_artifacts:
  - security_review
readable_artifacts:
  - implementation
  - canonical_specification
  - codebase_context
  - test_suite
  - pr_diff_context
forbidden_artifacts:
  - plan
reviewed_by: []
reviews:
  - implementer
agreement_participation:
  - agreement_type: implementation_agreement
    action: reviewed
required_capabilities:
  - code_review
  - reasoning
  - structured_output
model: claude-sonnet-5-thinking-high
max_tokens: null
dispatch_type: agent
runner: cursor
